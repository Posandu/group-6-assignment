<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My First AR-APP</title>

		<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
		<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

		<style>
			#arjs-video,
			.a-canvas {
				transform: scaleX(-1) !important;
			}
		</style>
	</head>

	<body style="margin: 0; overflow: hidden">
		<a-scene
			embedded
			vr-mode-ui="enabled: false"
			arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
		>
			<a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
			<a-light
				type="directional"
				color="#ffffff"
				intensity="0.8"
				position="1 3 2"
			></a-light>

			<a-marker preset="hiro">
				<a-torus-knot
					position="0 0.8 0"
					radius="0.25"
					radius-tubular="0.05"
					material="color: #00e5ff; metalness: 0.7; roughness: 0.2"
					animation="property: rotation; to: 360 360 0; dur: 6000; easing: linear; loop: true"
				>
				</a-torus-knot>

				<a-entity
					position="0 0.8 0"
					animation="property: rotation; to: 0 360 0; dur: 3000; easing: linear; loop: true"
				>
					<a-sphere
						position="0.7 0 0"
						radius="0.12"
						material="color: #ffeb3b; metalness: 0.3"
					></a-sphere>
				</a-entity>

				<a-box
					position="-0.6 0.15 0.6"
					scale="0.3 0.3 0.3"
					material="color: red"
					animation="property: position; to: -0.6 0.6 0.6; dir: alternate; dur: 700; easing: easeInOutQuad; loop: true"
				>
				</a-box>

				<a-cone
					position="0.6 0.25 0.6"
					radius-bottom="0.2"
					height="0.5"
					material="color: #e91e63"
					animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: 900; easing: easeInOutSine; loop: true"
				>
				</a-cone>

				<a-cylinder
					position="0 0.15 -0.7"
					radius="0.2"
					height="0.3"
					material="color: #4caf50"
					animation="property: components.material.material.color; type: color; from: #4caf50; to: #9c27b0; dir: alternate; dur: 1500; loop: true"
				>
				</a-cylinder>

				<a-ring
					position="0 0.01 0"
					rotation="-90 0 0"
					radius-inner="0.9"
					radius-outer="1"
					material="color: #ffffff; opacity: 0.8; transparent: true"
					animation="property: rotation; to: -90 0 360; dur: 8000; easing: linear; loop: true"
				>
				</a-ring>
			</a-marker>

			<a-entity camera></a-entity>
		</a-scene>
	</body>
</html>
