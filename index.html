<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My First AR-APP</title>

		<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
		<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

		<style>
			#arjs-video,
			.a-canvas {
				transform: scaleX(-1) !important;
			}

			#status {
				position: fixed;
				inset: 0 0 auto 0;
				z-index: 10;
				padding: 12px;
				text-align: center;
				font: bold 18px system-ui, sans-serif;
				color: #fff;
				background: #616161;
				pointer-events: none;
			}
			#status.found {
				background: #2e7d32;
			}
			#status.lost {
				background: #c62828;
			}
		</style>

		<script>
			AFRAME.registerComponent("mirrored-tap", {
				init() {
					const raycaster = new THREE.Raycaster();
					const visible = (o) => !o || (o.visible && visible(o.parent));

					window.addEventListener("click", (e) => {
						const { canvas, camera } = this.el;
						const rect = canvas.getBoundingClientRect();
						const x = 1 - ((e.clientX - rect.left) / rect.width) * 2;
						const y = 1 - ((e.clientY - rect.top) / rect.height) * 2;

						camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
						raycaster.setFromCamera({ x, y }, camera);

						const targets = [...this.el.querySelectorAll(".clickable")]
							.map((el) => el.object3D)
							.filter(visible);
						let obj = raycaster.intersectObjects(targets, true)[0]?.object;
						while (obj && !obj.el?.classList.contains("clickable")) obj = obj.parent;
						obj?.el.emit("click");
					});
				},
			});

			AFRAME.registerComponent("change-color", {
				init() {
					const colors = ["#2196f3", "#ff9800", "#e91e63", "#8bc34a", "#ffeb3b"];
					let i = 0;
					this.el.addEventListener("click", () => {
						i = (i + 1) % colors.length;
						this.el.setAttribute("material", "color", colors[i]);
					});
				},
			});

			AFRAME.registerComponent("toggle-grow", {
				schema: { factor: { default: 2 } },
				init() {
					const base = this.el.object3D.scale.clone();
					let big = false;
					this.el.addEventListener("click", () => {
						big = !big;
						const s = base.clone().multiplyScalar(big ? this.data.factor : 1);
						this.el.setAttribute("animation__grow", {
							property: "scale",
							to: `${s.x} ${s.y} ${s.z}`,
							dur: 300,
							easing: "easeOutBack",
						});
					});
				},
			});

			AFRAME.registerComponent("marker-status", {
				init() {
					const banner = document.getElementById("status");
					const set = (text, cls) => {
						banner.textContent = text;
						banner.className = cls;
					};
					this.el.addEventListener("markerFound", () => set("Marker found!", "found"));
					this.el.addEventListener("markerLost", () => set("Marker lost", "lost"));
				},
			});
		</script>
	</head>

	<body style="margin: 0; overflow: hidden">
		<div id="status">Searching for the Hiro marker...</div>

		<a-scene
			embedded
			vr-mode-ui="enabled: false"
			arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
			mirrored-tap
		>
			<a-assets>
				<a-asset-item id="vault" src="safe_vault.glb"></a-asset-item>
			</a-assets>

			<a-light type="ambient" intensity="0.6"></a-light>
			<a-light type="directional" intensity="0.8" position="1 3 2"></a-light>

			<a-marker preset="hiro" marker-status>
				<a-text
					value="Tap the ball or the box"
					align="center"
					width="4"
					position="0 1.4 0"
					scale="-1 1 1"
					side="double"
				></a-text>

				<a-entity gltf-model="#vault" position="0 0.03 0.16" scale="0.02 0.02 0.02"></a-entity>

				<a-torus-knot
					position="0 0.8 0"
					radius="0.25"
					radius-tubular="0.05"
					material="color: #00e5ff; metalness: 0.7; roughness: 0.2"
					animation="property: rotation; to: 360 360 0; dur: 6000; easing: linear; loop: true"
				></a-torus-knot>

				<a-entity
					position="0 0.8 0"
					animation="property: rotation; to: 0 360 0; dur: 3000; easing: linear; loop: true"
				>
					<a-sphere position="0.7 0 0" radius="0.12" color="#ffeb3b"></a-sphere>
				</a-entity>

				<a-sphere
					class="clickable"
					position="-0.65 0.18 -0.35"
					radius="0.18"
					color="#2196f3"
					change-color
				></a-sphere>

				<a-box
					class="clickable"
					position="-0.6 0.15 0.6"
					scale="0.3 0.3 0.3"
					color="red"
					animation="property: position; to: -0.6 0.6 0.6; dir: alternate; dur: 700; easing: easeInOutQuad; loop: true"
					toggle-grow
				></a-box>

				<a-cone
					position="0.6 0.25 0.6"
					radius-bottom="0.2"
					height="0.5"
					color="#e91e63"
					animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: 900; easing: easeInOutSine; loop: true"
				></a-cone>

				<a-cylinder
					position="0 0.15 -0.7"
					radius="0.2"
					height="0.3"
					color="#4caf50"
					animation="property: components.material.material.color; type: color; from: #4caf50; to: #9c27b0; dir: alternate; dur: 1500; loop: true"
				></a-cylinder>

				<a-ring
					position="0 0.01 0"
					rotation="-90 0 0"
					radius-inner="0.9"
					radius-outer="1"
					material="opacity: 0.8; transparent: true"
					animation="property: rotation; to: -90 0 360; dur: 8000; easing: linear; loop: true"
				></a-ring>
			</a-marker>

			<a-entity camera></a-entity>
		</a-scene>
	</body>
</html>
